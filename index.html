<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="E-REPORT school facility damage reporting system.">
  <title>E-REPORT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-dot"></span>
      <strong>E-REPORT</strong>
    </a>

    <nav class="nav">
      <a class="nav-link active" href="index.html">REPORT</a>

      <a class="nav-link dashboard-link" href="dashboard.html">
        DASHBOARD
        <span class="nav-count" id="nav-count">00</span>
      </a>
    </nav>
  </header>

  <main class="report-layout">
    <section class="report-intro">
      <h1>REPORT<br><span>FixItBuilding</span></h1>
      <p class="intro-copy">Facility Maintenance & Repair Request
    </section>

    <section class="form-panel">
      <form id="facility-report-form" class="report-form" onsubmit="handleFormSubmit(event)">
        <div class="field">
          <label for="reporter">REPORTER</label>
          <input id="reporter" name="reporter" type="text" placeholder="Your Full Name" required maxlength="60">
        </div>
        <!-- <div class="field">
          <label for="class-name">CLASS / ROLE</label>
          <input id="input-reporter" name="reporter" type="text" placeholder="X RPL / Teacher" required maxlength="40">
        </div> -->
        <div class="field">
          <label for="category">CATEGORY</label>
          <select id="select-category" name="category" required>
            <option value="">Select the damage category</option>
            <option value="AC">AC</option>
            <option value="Computer">Computer</option>
            <option value="Furniture">Furniture</option>
            <option value="Sanitation">Sanitation</option>
            <option value="Electrical">Electrical</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <!-- <div class="field">
          <label for="location">LOCATION</label>
          <input id="location" name="location" type="text" placeholder="Computer Lab 2" required maxlength="80">
        </div> -->
        <div class="field full">
          <label for="description">DESCRIPTION</label>
          <textarea id="textarea-description" name="description" rows="5" maxlength="200"
            placeholder="Please describe in detail the damage to the facility and its location..." required></textarea>
          <div class="char-count"><span id="char-count">0</span> / 200</div>
        </div>
        <button class="submit-button" type="submit">SEND REPORT</button>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

  </main>
  <footer class="footer">@ 2026 E-REPORT</footer>

  <!-- JS -->
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</body>

</html>
