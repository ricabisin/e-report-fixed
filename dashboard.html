<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="E-REPORT dashboard for monitoring school facility reports.">
  <title>E-REPORT | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span><strong>E-REPORT</strong></a>
    <nav class="nav">
      <a class="nav-link" href="index.html">REPORT</a>
      <a class="nav-link active dashboard-link" href="dashboard.html">DASHBOARD <span class="nav-count"
          id="nav-count">00</span></a>
    </nav>
  </header>

  <main class="dashboard-page">
    <div class="dashboard-heading">
      <div>
        <h1 class="dashboard-title">DASHBOARD</h1>
      </div>
    </div>

    <section class="stats-grid" aria-label="Report statistics">
      <article class="stat-card">
        <p>TOTAL REPORTS</p><strong id="total-count">00</strong>
      </article>
      <article class="stat-card waiting-card">
        <p>WAITING</p><strong id="waiting-count">00</strong>
      </article>
      <article class="stat-card completed-card">
        <p>COMPLETED REPORTS</p><strong id="completed-count">00</strong>
      </article>
    </section>

    <div class="filter-row" role="group" aria-label="Filter reports">
      <button class="filter-button active" data-filter="all">ALL <span id="all-filter-count">(0)</span></button>
      <button class="filter-button" data-filter="waiting">PENDING <span id="pending-filter-count">(0)</span></button>
      <button class="filter-button" data-filter="completed">COMPLETED <span id="done-filter-count">(0)</span></button>
    </div>

    <div class="table-wrap">
      <table class="report-table">
        <thead>
          <tr>
            <th>REPORTER</th>
            <th>CATEGORY</th>
            <th>DESCRIPTION</th>
            <th>STATUS</th>
            <th>ACTIONS</th>
          </tr>
        </thead>

      <tbody id="reports-table-body"></tbody>
      <!-- <tr><td colspan="5" class="empty-state">No reports yet.</td></tr> -->

      </table>
    </div>
  </main>
  <footer class="footer">@ 2026 E-REPORT</footer>

  <!-- JS -->
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>

</body>

</html>
